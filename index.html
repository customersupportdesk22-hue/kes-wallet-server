async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  const fetchOpts = { ...opts, headers };
  if (fetchOpts.body && typeof fetchOpts.body === 'object') fetchOpts.body = JSON.stringify(fetchOpts.body);
  const res = await fetch(API + path, fetchOpts);
  const rawText = await res.text();
  if (!res.ok) {
    let errData = {};
    try { errData = JSON.parse(rawText); } catch(e){}
    throw new Error(errData.error || ('HTTP ' + res.status));
  }
  return JSON.parse(rawText);
}

const esc = (s) => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (n) => n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const relTime = (t) => {
  const d = Date.now()-new Date(t).getTime(), m=Math.floor(d/60000);
  if (m<1) return 'Just now';
  if (m<60) return m+'m ago';
  const h=Math.floor(m/60); if (h<24) return h+'h ago';
  return new Date(t).toLocaleDateString();
};

async function submitOtp(email) {
  const otp = document.getElementById('otpInput').value;
  const btn = document.getElementById('verifyOtpBtn');
  const err = document.getElementById('otpError');
  if (otp.length !== 6) { err.textContent = 'Please enter a valid 6-digit code.'; return; }
  btn.innerText = 'Verifying...'; btn.disabled = true;
  try {
    const data = await api('/api/auth/verify-otp', { method: 'POST', body: { email, otp } });
    TOKEN = data.token; localStorage.setItem('kes_token', TOKEN); ME = data.user;
    localStorage.setItem('bb_last_user', JSON.stringify({ id: ME.id, name: ME.name, email: ME.email, phone: ME.phone}));
    closeModal();
    toast('Email verified!', 'ok');
    pinMode = 'setup'; pinBuffer = ''; pinFirst = '';
    renderAuth();
  } catch (e) {
    err.textContent = e.message; btn.innerText = 'Verify & Continue'; btn.disabled = false;
  }
}

async function handlePin(){
  if (!ME){ doLogout(); return; }
  if (pinMode==='setup'){
    if (!pinFirst){ pinFirst = pinBuffer; pinBuffer=''; authError=''; renderAuth(); toast('Confirm your PIN','info'); return; }
    if (pinFirst!==pinBuffer){ authError='PINs did not match.'; pinFirst=''; pinBuffer=''; renderAuth(); return; }
    localStorage.setItem('kes_pin_' + ME.id, pinBuffer);
    sessionStorage.setItem('kes_unlocked_' + ME.id, '1');
    pinBuffer=''; pinFirst=''; toast('PIN set','ok'); enterApp(); return;
  }
  const savedPin = localStorage.getItem('kes_pin_' + ME.id);
  if (savedPin && pinBuffer === savedPin){
    if (TOKEN){ sessionStorage.setItem('kes_unlocked_' + ME.id, '1'); pinBuffer=''; authError=''; enterApp(); return; }
    TOKEN = ''; localStorage.removeItem('kes_token');
    pinBuffer = ''; authError = 'Session expired.'; authScreen = 'signin'; pinMode = 'login'; renderAuth(); return;
  }
  authError='Incorrect PIN.'; pinBuffer=''; renderAuth();
}

const amt = document.getElementById('bbAmount');
const mon = document.getElementById('bbMonths');
function calc(){
  if(!amt || !mon) return;
  var P = parseFloat(amt.value) || 0;
  var n = parseInt(mon.value) || 1;
  var r = 0.10 / 12;
  var m = (r === 0) ? P / n : (P * r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);
  if(document.getElementById('bbMonthly')) document.getElementById('bbMonthly').textContent = 'KES ' + Math.round(m).toLocaleString();
  if(document.getElementById('bbTotal')) document.getElementById('bbTotal').textContent = 'KES ' + Math.round(m*n).toLocaleString();
}
if(amt) amt.addEventListener('input', calc);
if(mon) mon.addEventListener('input', calc);

async function onWithdraw(e){

  if (!amt || amt < LIMITS.withdrawMin) return toast(`Minimum is ${money(LIMITS.withdrawMin)}`, 'err');
  if (amt > LIMITS.withdrawMax) return toast(`Max is ${money(LIMITS.withdrawMax)}`, 'err');
  
  // 1. Check if they actually have the money
  if (amt > num(u.balance)) return toast('Insufficient balance.', 'err', 5000);
  
  if (u.status !== 'active') return toast('Wallet is frozen', 'err');

  // 2. If they have a loan, they CANNOT withdraw partial amounts. 
  // The system forces them to take the full remaining balance.
  const activeLoan = (CACHE.loans || []).find(l => l.status === 'active');
  if (activeLoan && Math.abs(amt - u.balance) > 0.01) {
      return toast(`You must withdraw your full remaining balance of KES ${u.balance.toLocaleString()}.`, 'err', 6000);
  }

  // 3. TRIGGER THE SMS (This is what was missing)
  try {
    await api('/api/wallet/withdrawal-sms', { method: 'POST', body: { amount: amt } });
  } catch(err) {
    console.log('SMS failed to send', err);
  }

  // 4. Show the KCB fee popup
  showWithdrawInstructions(amt, u);
  }

// Estimate sharpness using the variance of the Laplacian (not just image brightness).
function kycImageIsBlurry(image) {
  const maxSide = 420;
  const scale = Math.min(1, maxSide / Math.max(image.naturalWidth || image.width, image.naturalHeight || image.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round((image.naturalWidth || image.width) * scale));
  canvas.height = Math.max(1, Math.round((image.naturalHeight || image.height) * scale));
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const w = canvas.width, h = canvas.height;
  const gray = new Float32Array(w * h);
  for (let i = 0, p = 0; i < pixels.length; i += 4, p++) {
    gray[p] = 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
  }
  let sum = 0, sumSq = 0, count = 0;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const lap = gray[i - w] + gray[i + w] + gray[i - 1] + gray[i + 1] - 4 * gray[i];
      sum += lap; sumSq += lap * lap; count++;
    }
  }
  if (!count) return true;
  const variance = (sumSq / count) - Math.pow(sum / count, 2);
  return variance < 55;
}

function handleKycPhotoUpload(event, type) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  if (!file.type || !file.type.startsWith('image/')) {
    event.target.value = '';
    return toast('Please choose an image file.', 'err', 4000);
  }
  if (file.size > 12 * 1024 * 1024) {
    event.target.value = '';
    return toast('Image is too large. Choose a photo under 12 MB.', 'err', 4500);
  }
  const reader = new FileReader();
  reader.onload = function() {
    const image = new Image();
    image.onload = function() {
      if (kycImageIsBlurry(image)) {
        event.target.value = '';
        return toast('This photo looks blurry. Please choose a sharper photo or retake it in good light.', 'err', 5500);
      }
      const canvas = document.createElement('canvas');
      const maxSide = 1600;
      const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
      canvas.width = Math.round(image.naturalWidth * scale);
      canvas.height = Math.round(image.naturalHeight * scale);
      canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
      window.kycImages[type] = dataUrl;
      const preview = document.getElementById(type + 'Preview');
      if (preview) { preview.src = dataUrl; preview.style.display = 'block'; }
      toast('Clear ' + type + ' photo uploaded.', 'ok', 2500);
    };
    image.onerror = function() { toast('Could not read this image. Please try another photo.', 'err'); };
    image.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function handleKraCertificateUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const allowed = file.type === 'application/pdf' || (file.type && file.type.startsWith('image/'));
  if (!allowed) { event.target.value = ''; return toast('Please choose a PDF or image certificate.', 'err'); }
  if (file.size > 5 * 1024 * 1024) { event.target.value = ''; return toast('KRA certificate must be under 5 MB.', 'err'); }
  const reader = new FileReader();
  reader.onload = function() {
    window.pendingKraCertificate = { fileName: file.name, mimeType: file.type, data: reader.result };
    const label = document.getElementById('kycKraFileName');
    if (label) label.textContent = file.name;
    toast('KRA certificate attached.', 'ok', 2500);
  };
  reader.onerror = function() { toast('Could not read the KRA certificate.', 'err'); };
  reader.readAsDataURL(file);
}

// --- BUSINESS IMAGE SLIDER ---
let currentSlide = 0;
let businessSliderTimer = null;
function stopBusinessSlider() {
    if (businessSliderTimer !== null) {
        clearInterval(businessSliderTimer);
        businessSliderTimer = null;
    }
}
function startBusinessSlider() {
    stopBusinessSlider();
    const slider = document.getElementById('bizSlider');
    if (!slider) return;
    const slides = slider.querySelectorAll('img');
    if (!slides.length) return;
    currentSlide = 0;
    slides.forEach((slide, index) => slide.classList.toggle('active', index === 0));
    if (slides.length < 2) return;
    businessSliderTimer = setInterval(() => {
        const currentSlider = document.getElementById('bizSlider');
        if (!currentSlider || view !== 'dashboard') { stopBusinessSlider(); return; }
        const currentSlides = currentSlider.querySelectorAll('img');
        if (!currentSlides.length) { stopBusinessSlider(); return; }
        currentSlides.forEach(slide => slide.classList.remove('active'));
        currentSlide = (currentSlide + 1) % currentSlides.length;
        currentSlides[currentSlide].classList.add('active');
    }, 4000);
}
// --- LIVE CAMERA LOGIC ---
let videoStream = null;
let currentCaptureType = null;

async function startCamera(type) {
    currentCaptureType = type;
    document.getElementById('cameraTitle').innerText = 
        type === 'front' ? 'Scan ID Front' : (type === 'back' ? 'Scan ID Back' : 'Take Selfie');
    
    const overlay = document.getElementById('cameraOverlay');
    const video = document.getElementById('cameraVideo');
    overlay.style.display = 'flex';

    try {
        const constraints = { video: { facingMode: type === 'selfie' ? 'user' : 'environment' } };
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = videoStream;
} catch (err) {
    console.log("Camera Error:", err); // Check your browser console for this
    if (err.name === 'NotAllowedError') {
        toast('Permission denied. Please allow camera access in your browser settings.', 'err', 5000);
    } else if (err.name === 'NotReadableError') {
        toast('Camera is busy. Please close WhatsApp/Camera app and try again.', 'err', 5000);
    } else {
        toast('Camera unavailable: ' + err.message, 'err', 5000);
    }
    stopCamera();
}
}

function stopCamera() {
    if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
    }
    document.getElementById('cameraOverlay').style.display = 'none';
}

function capturePhoto() {
  const video = document.getElementById('cameraVideo');
  if (video.videoWidth === 0) { toast('Camera is still loading...', 'err'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const sharpnessCheckImage = new Image();
  sharpnessCheckImage.onload = function() {
    if (kycImageIsBlurry(sharpnessCheckImage)) {
      toast(`The ${currentCaptureType} photo looks blurry. Hold steady, improve the lighting and try again.`, 'err', 5000);
      return;
    }
    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.78);
    window.kycImages[currentCaptureType] = compressedBase64;
    const preview = document.getElementById(currentCaptureType + 'Preview');
    if (preview) { preview.src = compressedBase64; preview.style.display = 'block'; }
    toast(`Clear ${currentCaptureType} photo captured!`, 'ok', 2000);
    stopCamera();
  };
  sharpnessCheckImage.onerror = function() { toast('Could not check photo quality. Please try again.', 'err'); };
  sharpnessCheckImage.src = canvas.toDataURL('image/jpeg', 0.85);
}
  function notificationIsIncomingMoney(n) {
    const type = String(n.type || n.category || n.event || n.notification_type || '').toLowerCase();
    const title = String(n.title || '').toLowerCase();
    const message = String(n.message || '').toLowerCase();
    return /deposit|transfer_in|money_received|payment_received|credit|credited|received/.test(type) ||
           /money received|payment received|deposit received|you received|wallet credited|amount credited/.test(title + ' ' + message);
  }

  function notificationTransactionId(n) {
    const payload = (n && typeof n.data === 'object' && n.data) ||
                    (n && typeof n.metadata === 'object' && n.metadata) ||
                    (n && typeof n.payload === 'object' && n.payload) || {};
    return n.transaction_id || n.transactionId || n.tx_id || n.txId ||
           n.related_transaction_id || n.relatedTransactionId ||
           payload.transaction_id || payload.transactionId || payload.tx_id || payload.txId ||
           null;
  }

  async function openNotificationItem(index) {
    const n = (CACHE.notifications || [])[Number(index)];
    if (!n) return;
    if (!notificationIsIncomingMoney(n)) {
      toast('This notification has no transaction receipt to open.', 'info', 3000);
      return;
    }

    const txId = notificationTransactionId(n);
    if (!txId) {
      toast('Receipt link is not available for this notification yet. Please contact support if money was credited.', 'err', 5000);
      return;
    }

    try {
      if (!CACHE.txs || !CACHE.txs.length) {
        const r = await api('/api/wallet/txs');
        CACHE.txs = r.txs || [];
      }
      const tx = CACHE.txs.find(t => String(t.id) === String(txId));
      if (!tx) {
        const r = await api('/api/wallet/txs');
        CACHE.txs = r.txs || [];
      }
      const matchingTx = (CACHE.txs || []).find(t => String(t.id) === String(txId));
      if (!matchingTx) {
        toast('The matching transaction could not be found. Please refresh and try again.', 'err', 4000);
        return;
      }
      window.currentTxId = matchingTx.id;
      navigate('receipt');
    } catch (e) {
      toast('Could not open the transaction receipt. Please try again.', 'err', 4000);
    }
  }

        CACHE.unreadNotifications = 0;
