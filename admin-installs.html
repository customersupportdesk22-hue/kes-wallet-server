<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — PWA Installs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .subtitle { color: #7d8590; font-size: 14px; margin-bottom: 24px; }
  .login-box { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; max-width: 400px; margin: 60px auto; }
  .login-box h2 { font-size: 18px; margin-bottom: 16px; text-align: center; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #7d8590; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; }
  .btn { background: #238636; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #2ea043; }
  .btn-block { display: block; width: 100%; }
  .error { color: #f85149; font-size: 13px; margin-top: 10px; text-align: center; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
  .stat .label { font-size: 11px; color: #7d8590; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 4px; color: #e6edf3; }
  .stat.blue .value { color: #60a5fa; }
  .stat.green .value { color: #2ea043; }
  .stat.yellow .value { color: #d29922; }
  .stat.purple .value { color: #a78bfa; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,#22c55e,#16a34a); display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #04140a; flex-shrink: 0; }
  .card-content { flex: 1; min-width: 0; }
  .card-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .card-sub { font-size: 13px; color: #7d8590; margin-bottom: 6px; }
  .card-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: #6e7681; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
  .badge.green { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
  .badge.yellow { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid rgba(210,153,34,0.3); }
  .badge.blue { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
  .empty { text-align: center; padding: 60px 20px; color: #7d8590; }
  .empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .logout { background: #21262d; color: #e6edf3; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .logout:hover { background: #30363d; }
  .nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .nav a { text-decoration: none; background: #21262d; color: #e6edf3; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .nav a:hover { background: #30363d; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #238636; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .toast.err { background: #da3633; }
</style>
</head>
<body>

<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://kes-wallet-server.onrender.com';
let TOKEN = localStorage.getItem('admin_token') || '';
let ME = null;

function $(sel) { return document.querySelector(sel); }
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (isErr ? ' err' : '');
  setTimeout(() => t.className = 'toast', 3500);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  const res = await fetch(API_BASE + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function renderLogin(error) {
  $('#app').innerHTML = `
    <div class="login-box">
      <h2>📱 PWA Installs</h2>
      <div class="field">
        <label>Admin Email</label>
        <input id="email" type="email" placeholder="admin@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-block" onclick="doLogin()">Sign In</button>
      ${error ? `<div class="error">${esc(error)}</div>` : ''}
    </div>
  `;
}

async function doLogin() {
  const email = $('#email').value.trim();
  const password = $('#password').value;
  if (!email || !password) return renderLogin('Enter email and password');
  try {
    const r = await api('/api/login', { method: 'POST', body: { email, password } });
    if (r.user.role !== 'admin') return renderLogin('Not an admin account');
    TOKEN = r.token; ME = r.user;
    localStorage.setItem('admin_token', TOKEN);
    renderDashboard();
  } catch(e) {
    renderLogin(e.message);
  }
}

async function renderDashboard() {
  $('#app').innerHTML = `
    <div class="top-bar">
      <div>
        <h1>📱 PWA Installs</h1>
        <div class="subtitle">Users who installed the Biashara app</div>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
    <div class="nav">
      <a href="/admin-approve.html">← Back to Admin Panel</a>
      <a href="/admin-cleanup.html">🧹 Cleanup Tools</a>
    </div>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
  `;
  loadInstalls();
  setInterval(loadInstalls, 60000);
}

async function loadInstalls() {
  try {
    const r = await api('/api/admin/pwa-installs');

    $('#stats').innerHTML = `
      <div class="stat blue"><div class="label">Total Users</div><div class="value">${r.total_users}</div></div>
      <div class="stat green"><div class="label">Installed</div><div class="value">${r.total_installs}</div></div>
      <div class="stat purple"><div class="label">Install Rate</div><div class="value">${r.install_rate}%</div></div>
      <div class="stat yellow"><div class="label">Not Installed</div><div class="value">${r.total_users - r.total_installs}</div></div>
    `;

    if (!r.items || !r.items.length) {
      $('#list').innerHTML = `<div class="empty"><div class="icon">📱</div><div>No installs yet</div><div style="font-size:12px;margin-top:8px">Users who install the app will appear here.</div></div>`;
      return;
    }

    $('#list').innerHTML = r.items.map(u => {
      const initials = (u.name || 'U').split(' ').filter(Boolean).slice(0,2).map(n => n[0]).join('').toUpperCase();
      const kycBadge = u.kyc_status === 'verified' 
        ? '<span class="badge green">✅ Verified</span>' 
        : u.kyc_status === 'pending'
        ? '<span class="badge yellow">⏳ Pending</span>'
        : '<span class="badge blue">🔐 Unverified</span>';
      const date = u.installed_at ? new Date(u.installed_at).toLocaleString() : 'Unknown';
      const ago = u.installed_at ? timeAgo(u.installed_at) : '';
      
      return `
        <div class="card">
          <div class="avatar">${esc(initials)}</div>
          <div class="card-content">
            <div class="card-name">${esc(u.name)}</div>
            <div class="card-sub">📱 ${esc(u.phone)}</div>
            <div class="card-meta">
              ${kycBadge}
              <span>📅 Installed ${ago}</span>
              <span style="color:#4a5568;">${date}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  } catch(e) {
    toast('Failed to load: ' + e.message, true);
    if (e.message === 'Invalid token' || e.message === 'No token') {
      TOKEN = ''; localStorage.removeItem('admin_token');
      renderLogin('Session expired');
    }
  }
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const diff = Date.now() - d.getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return min + 'm ago';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + 'h ago';
  const days = Math.floor(hr / 24);
  if (days < 30) return days + 'd ago';
  return Math.floor(days / 30) + 'mo ago';
}

function logout() {
  TOKEN = ''; localStorage.removeItem('admin_token');
  renderLogin();
}

(async function init() {
  if (!TOKEN) return renderLogin();
  try {
    const r = await api('/api/me');
    if (!r.user || r.user.role !== 'admin') {
      TOKEN = ''; localStorage.removeItem('admin_token');
      return renderLogin('Not an admin account');
    }
    ME = r.user;
    renderDashboard();
  } catch(e) {
    TOKEN = ''; localStorage.removeItem('admin_token');
    renderLogin();
  }
})();
</script>
</body>
</html>
