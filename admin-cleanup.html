<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Cleanup Tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .subtitle { color: #7d8590; font-size: 14px; margin-bottom: 24px; }
  .login-box { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; max-width: 400px; margin: 60px auto; }
  .login-box h2 { font-size: 18px; margin-bottom: 16px; text-align: center; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #7d8590; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; }
  .btn { background: #238636; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #2ea043; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { background: #da3633; }
  .btn-danger:hover { background: #f85149; }
  .btn-orange { background: #d29922; color: #0d1117; }
  .btn-orange:hover { background: #e3b341; }
  .btn-secondary { background: #21262d; }
  .btn-secondary:hover { background: #30363d; }
  .btn-block { display: block; width: 100%; }
  .btn-sm { padding: 8px 12px; font-size: 13px; }
  .error { color: #f85149; font-size: 13px; margin-top: 10px; text-align: center; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
  .stat .label { font-size: 11px; color: #7d8590; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .stat .value { font-size: 24px; font-weight: 700; margin-top: 4px; color: #e6edf3; }
  .stat.blue .value { color: #60a5fa; }
  .stat.green .value { color: #2ea043; }
  .stat.yellow .value { color: #d29922; }
  .stat.purple .value { color: #a78bfa; }
  .stat.red .value { color: #f85149; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .card-sub { font-size: 13px; color: #7d8590; margin-bottom: 14px; line-height: 1.5; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 100px; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .logout { background: #21262d; color: #e6edf3; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .logout:hover { background: #30363d; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #238636; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; }
  .toast.on { opacity: 1; }
  .toast.err { background: #da3633; }
  .nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .nav a { text-decoration: none; background: #21262d; color: #e6edf3; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .nav a:hover { background: #30363d; }
  .result { background: #0d1117; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 13px; color: #7d8590; white-space: pre-wrap; font-family: monospace; max-height: 200px; overflow-y: auto; display: none; }
  .result.on { display: block; }
</style>
</head>
<body>

<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://kes-wallet-server-3iow.onrender.com';
let TOKEN = localStorage.getItem('admin_token') || '';
let ME = null;

function $(sel) { return document.querySelector(sel); }

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (isErr ? ' err' : '');
  setTimeout(() => t.className = 'toast', 4000);
}

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  const res = await fetch(API_BASE + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function renderLogin(error) {
  $('#app').innerHTML = `
    <div class="login-box">
      <h2>🧹 Cleanup Tools</h2>
      <div class="field">
        <label>Admin Email</label>
        <input id="email" type="email" placeholder="admin@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-block" onclick="doLogin()">Sign In</button>
      ${error ? `<div class="error">${esc(error)}</div>` : ''}
    </div>
  `;
}

async function doLogin() {
  const email = $('#email').value.trim();
  const password = $('#password').value;
  if (!email || !password) return renderLogin('Enter email and password');
  try {
    const r = await api('/api/login', { method: 'POST', body: { email, password } });
    if (r.user.role !== 'admin') return renderLogin('Not an admin account');
    TOKEN = r.token; ME = r.user;
    localStorage.setItem('admin_token', TOKEN);
    renderDashboard();
  } catch (e) {
    renderLogin(e.message);
  }
}

async function renderDashboard() {
  $('#app').innerHTML = `
    <div class="top-bar">
      <div>
        <h1>🧹 Cleanup Tools</h1>
        <div class="subtitle">Welcome, ${esc(ME.name)}</div>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="nav">
      <a href="/admin-approve.html">← Back to Admin Panel</a>
    </div>

    <div class="stats" id="stats">
      <div class="stat"><div class="label">Loading...</div><div class="value">—</div></div>
    </div>

    <!-- KYC Photos Cleanup -->
    <div class="card">
      <div class="card-title">📷 Clean Old KYC Photos</div>
      <div class="card-sub">
        Deletes photos from Cloudinary for KYC submissions that are reviewed AND older than the specified days. <br>
        <b style="color:#2ea043;">Keeps the KYC records in MongoDB.</b>
      </div>
      <div class="row">
        <input type="number" id="kycDays" value="90" placeholder="Days old">
        <button class="btn btn-orange btn-sm" onclick="cleanupKycPhotos()">🧹 Clean KYC Photos</button>
      </div>
      <div class="result" id="kycResult"></div>
    </div>

    <!-- Notifications Cleanup -->
    <div class="card">
      <div class="card-title">🔔 Clean Old Notifications</div>
      <div class="card-sub">
        Deletes notifications older than the specified days. This frees up MongoDB space.
      </div>
      <div class="row">
        <input type="number" id="notifDays" value="30" placeholder="Days old">
        <button class="btn btn-orange btn-sm" onclick="cleanupNotifications()">🧹 Clean Notifications</button>
      </div>
      <div class="result" id="notifResult"></div>
    </div>

    <!-- Delete Specific User -->
    <div class="card">
      <div class="card-title">🗑️ Delete a User (Full Cleanup)</div>
      <div class="card-sub">
        Permanently deletes a user + ALL their data: transactions, loans, notifications, KYC records, and KYC photos.
        <br><b style="color:#f85149;">⚠️ This cannot be undone!</b>
      </div>
      <div class="row">
        <input type="text" id="deleteUserId" placeholder="User ID (MongoDB _id)">
        <button class="btn btn-danger btn-sm" onclick="deleteUser()">🗑️ Delete User</button>
      </div>
      <div class="result" id="userResult"></div>
    </div>

    <!-- Delete Specific KYC -->
    <div class="card">
      <div class="card-title">🗑️ Delete a KYC Record</div>
      <div class="card-sub">
        Deletes a single KYC submission + its photos from Cloudinary.
      </div>
      <div class="row">
        <input type="text" id="deleteKycId" placeholder="KYC ID (MongoDB _id)">
        <button class="btn btn-danger btn-sm" onclick="deleteKyc()">🗑️ Delete KYC</button>
      </div>
      <div class="result" id="kycDeleteResult"></div>
    </div>

    <!-- Delete Specific Transaction -->
    <div class="card">
      <div class="card-title">🗑️ Delete a Transaction</div>
      <div class="card-sub">
        Deletes a single transaction record from MongoDB.
        <br><b style="color:#f85149;">⚠️ This affects user balance history!</b>
      </div>
      <div class="row">
        <input type="text" id="deleteTxId" placeholder="Transaction ID (MongoDB _id)">
        <button class="btn btn-danger btn-sm" onclick="deleteTx()">🗑️ Delete Transaction</button>
      </div>
      <div class="result" id="txDeleteResult"></div>
    </div>
  `;
  loadStats();
}

async function loadStats() {
  try {
    const r = await api('/api/admin/storage-stats');
    $('#stats').innerHTML = `
      <div class="stat blue"><div class="label">Users</div><div class="value">${r.users}</div></div>
      <div class="stat green"><div class="label">Transactions</div><div class="value">${r.transactions}</div></div>
      <div class="stat yellow"><div class="label">Loans</div><div class="value">${r.loans}</div></div>
      <div class="stat purple"><div class="label">Notifications</div><div class="value">${r.notifications}</div></div>
      <div class="stat"><div class="label">KYC Records</div><div class="value">${r.kyc}</div></div>
      <div class="stat red"><div class="label">KYC With Photos</div><div class="value">${r.kyc_with_photos}</div></div>
      <div class="stat green"><div class="label">Est. MongoDB Size</div><div class="value">${r.estimated_size_mb} MB</div></div>
    `;
  } catch (e) {
    toast('Failed to load stats: ' + e.message, true);
  }
}

async function cleanupKycPhotos() {
  const days = Number($('#kycDays').value) || 90;
  if (!confirm(`Delete KYC photos older than ${days} days?\n\nKYC records will be KEPT.`)) return;
  const el = $('#kycResult');
  el.textContent = '⏳ Cleaning...';
  el.classList.add('on');
  try {
    const r = await api('/api/admin/cleanup-kyc-photos', { method: 'POST', body: { days } });
    el.textContent = `✅ Done!\n\nCleaned: ${r.cleaned}\nTotal found: ${r.total_found}\nOlder than: ${r.days} days`;
    toast('✅ KYC photos cleaned');
    loadStats();
  } catch (e) {
    el.textContent = '❌ Error: ' + e.message;
    toast('Failed: ' + e.message, true);
  }
}

async function cleanupNotifications() {
  const days = Number($('#notifDays').value) || 30;
  if (!confirm(`Delete notifications older than ${days} days?`)) return;
  const el = $('#notifResult');
  el.textContent = '⏳ Cleaning...';
  el.classList.add('on');
  try {
    const r = await api('/api/admin/cleanup-notifications', { method: 'POST', body: { days } });
    el.textContent = `✅ Done!\n\nDeleted: ${r.deleted}\nOlder than: ${r.days} days`;
    toast('✅ Notifications cleaned');
    loadStats();
  } catch (e) {
    el.textContent = '❌ Error: ' + e.message;
    toast('Failed: ' + e.message, true);
  }
}

async function deleteUser() {
  const userId = $('#deleteUserId').value.trim();
  if (!userId) return toast('Enter User ID', true);
  if (!confirm(`DELETE USER?\n\nUser ID: ${userId}\n\nThis deletes ALL their data including:\n• Transactions\n• Loans\n• Notifications\n• KYC records\n• Cloudinary photos\n\nThis CANNOT be undone!`)) return;
  if (!confirm('Are you ABSOLUTELY sure? This is permanent!')) return;
  const el = $('#userResult');
  el.textContent = '⏳ Deleting...';
  el.classList.add('on');
  try {
    const r = await api('/api/admin/user/' + userId, { method: 'DELETE' });
    el.textContent = `✅ Deleted user: ${r.deleted_user}\nKYC records removed: ${r.deleted_kyc}`;
    toast('✅ User deleted');
    $('#deleteUserId').value = '';
    loadStats();
  } catch (e) {
    el.textContent = '❌ Error: ' + e.message;
    toast('Failed: ' + e.message, true);
  }
}

async function deleteKyc() {
  const kycId = $('#deleteKycId').value.trim();
  if (!kycId) return toast('Enter KYC ID', true);
  if (!confirm(`Delete KYC record + photos?\n\nKYC ID: ${kycId}\n\nThis CANNOT be undone!`)) return;
  const el = $('#kycDeleteResult');
  el.textContent = '⏳ Deleting...';
  el.classList.add('on');
  try {
    await api('/api/admin/kyc/' + kycId, { method: 'DELETE' });
    el.textContent = '✅ KYC deleted';
    toast('✅ KYC deleted');
    $('#deleteKycId').value = '';
    loadStats();
  } catch (e) {
    el.textContent = '❌ Error: ' + e.message;
    toast('Failed: ' + e.message, true);
  }
}

async function deleteTx() {
  const txId = $('#deleteTxId').value.trim();
  if (!txId) return toast('Enter Transaction ID', true);
  if (!confirm(`Delete this transaction?\n\nTx ID: ${txId}\n\n⚠️ This affects user balance history!`)) return;
  const el = $('#txDeleteResult');
  el.textContent = '⏳ Deleting...';
  el.classList.add('on');
  try {
    await api('/api/admin/tx/' + txId, { method: 'DELETE' });
    el.textContent = '✅ Transaction deleted';
    toast('✅ Transaction deleted');
    $('#deleteTxId').value = '';
    loadStats();
  } catch (e) {
    el.textContent = '❌ Error: ' + e.message;
    toast('Failed: ' + e.message, true);
  }
}

function logout() {
  TOKEN = ''; localStorage.removeItem('admin_token');
  renderLogin();
}

(async function init() {
  if (!TOKEN) return renderLogin();
  try {
    const r = await api('/api/me');
    if (!r.user || r.user.role !== 'admin') {
      TOKEN = ''; localStorage.removeItem('admin_token');
      return renderLogin('Not an admin account');
    }
    ME = r.user;
    renderDashboard();
  } catch (e) {
    TOKEN = ''; localStorage.removeItem('admin_token');
    renderLogin();
  }
})();
</script>
</body>
</html>
