<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Biashara Boost</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#0d1117;color:#e6edf3;min-height:100vh;padding:16px}
.container{max-width:1000px;margin:auto}
h1{font-size:23px;margin-bottom:5px}.subtitle{color:#8b949e;font-size:13px;margin-bottom:20px}
.login-box,.card,.stat,.modal{background:#161b22;border:1px solid #30363d;border-radius:13px}
.login-box{padding:28px;max-width:410px;margin:55px auto}.login-box h2{text-align:center;margin-bottom:20px}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:#9da7b3;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2ea043}
.btn{background:#238636;color:white;border:0;padding:11px 15px;border-radius:8px;font-weight:650;cursor:pointer;font-size:13px}
.btn:hover{background:#2ea043}.btn:disabled{opacity:.55;cursor:wait}
.btn-danger{background:#da3633}.btn-secondary{background:#30363d}.btn-block{width:100%}
.error{color:#ff7b72;font-size:13px;margin-top:10px;text-align:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.logout{background:#30363d;color:white;border:0;padding:9px 14px;border-radius:7px;cursor:pointer}
.tabs{display:flex;gap:6px;padding:6px;background:#161b22;border:1px solid #30363d;border-radius:11px;overflow-x:auto;margin-bottom:18px}
.tab{flex:1;background:transparent;color:#9da7b3;border:0;border-radius:8px;padding:11px 13px;white-space:nowrap;font-weight:650;cursor:pointer}
.tab.active{background:#30363d;color:white}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:135px;padding:15px}.stat .label{font-size:11px;color:#9da7b3;text-transform:uppercase}.stat .value{font-size:23px;font-weight:750;margin-top:4px}.green{color:#3fb950}.yellow{color:#d29922}
.card{padding:16px;margin-bottom:12px}.card-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.card-name{font-size:15px;font-weight:700}.card-sub{font-size:12px;color:#8b949e;margin-top:3px}
.amount{font-size:19px;font-weight:750;color:#ff7b72;text-align:right}
.details{background:#0d1117;border-radius:8px;padding:11px;margin:12px 0;font-size:13px}
.detail-row{display:flex;justify-content:space-between;gap:12px;margin:6px 0}.detail-row span:first-child{color:#8b949e}.detail-row span:last-child{text-align:right;overflow-wrap:anywhere}
.actions{display:flex;gap:8px}.actions .btn{flex:1}
.empty{text-align:center;padding:42px 15px;color:#8b949e}
.badge{font-size:10px;padding:5px 9px;border-radius:20px;background:#3d3216;color:#e3b341;font-weight:700}
.image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.image-grid img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid #30363d;background:#0d1117}
.image-grid a{color:#8b949e;text-decoration:none;font-size:10px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #30363d}
.toggle-row:last-child{border:0}.toggle-label{font-size:14px;font-weight:650}.toggle-desc{font-size:11px;color:#8b949e}
.switch{width:45px;height:24px;position:relative}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#30363d;border-radius:20px;cursor:pointer}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#238636}.switch input:checked+.slider:before{transform:translateX(21px)}
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-bg.on{display:flex}.modal{padding:22px;width:100%;max-width:420px}.modal h3{margin-bottom:8px}.modal p{font-size:13px;color:#9da7b3;margin-bottom:15px}.modal .btn{width:100%;margin-top:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#238636;color:white;padding:12px 18px;border-radius:9px;z-index:40;opacity:0;pointer-events:none;transition:.2s;max-width:90%;font-size:13px}.toast.on{opacity:1}.toast.err{background:#da3633}
.kra-box{border:1px solid #30363d;background:#0d1117;border-radius:9px;padding:12px;margin:10px 0;font-size:13px}.muted{color:#8b949e;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.reg-sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8b949e;border-bottom:1px solid #30363d;padding-bottom:6px;margin:6px 0 14px}.ferr{color:#ff7b72;font-size:11px;margin-top:4px;min-height:14px}input.invalid{border-color:#da3633}.pw-wrap{position:relative}.pw-wrap input{padding-right:42px}.pw-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:16px;color:#9da7b3;padding:6px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}body{padding:10px}.top-bar{align-items:flex-start}.tab{padding:10px;font-size:12px}.card{padding:13px}.image-grid img{height:82px}.actions{flex-direction:column}.amount{font-size:16px}}
</style>
</head>
<body>
<div class="container" id="app"></div>
<div class="modal-bg" id="modalBg"><div class="modal">
<h3 id="modalTitle">Confirm action</h3><p id="modalDesc">Please confirm.</p>
<div class="field" id="modalField"><label>M-Pesa receipt code</label><input id="mpesaReceipt" placeholder="Enter receipt code"></div>
<button class="btn" onclick="confirmApprove()">Confirm</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
</div></div>
<div class="toast" id="toast"></div>
<script src="https://CHANGE-TO-YOUR-API-DOMAIN/socket.io/socket.io.js"></script>
<script>
'use strict';
const API_BASE='https://kes-wallet-server-3iow.onrender.com';
let TOKEN=localStorage.getItem('admin_token')||'',ME=null;
let PENDING_WITHDRAWALS=[],PENDING_LOANS=[],PENDING_KYC=[],PENDING_ACTIVATIONS=[];
let currentTab='withdrawals',currentTxId=null,currentLoanId=null,refreshTimer=null,SEARCHED_USER=null;
let DEPOSIT_SETTINGS={method:'paybill',paybillNumber:'',paybillAccount:'',tillNumber:'',sendMoneyNumber:'',sendMoneyName:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,err=false){const t=$('#toast');t.textContent=msg;t.className='toast on'+(err?' err':'');setTimeout(()=>t.className='toast',3500)}
async function api(path,opts={}){const headers={'Content-Type':'application/json'};if(TOKEN)headers.Authorization='Bearer '+TOKEN;const res=await fetch(API_BASE+path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Request failed ('+res.status+')');return data}
function renderLogin(error=''){clearInterval(refreshTimer);$('#app').innerHTML=`<div class="login-box"><h2>🔐 Admin Login</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div><button class="btn btn-block" onclick="doLogin()">Sign In</button>${error?`<div class="error">${esc(error)}</div>`:''}</div>`}
async function doLogin(){const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return renderLogin('Enter email and password');try{const r=await api('/api/login',{method:'POST',body:{email,password}});if(r.user?.role!=='admin')return renderLogin('This account is not an admin');TOKEN=r.token;ME=r.user;localStorage.setItem('admin_token',TOKEN);renderDashboard()}catch(e){renderLogin(e.message)}}
async function loadData(){try{const [w,l,k,a,s]=await Promise.all([api('/api/admin/pending-withdrawals'),api('/api/admin/pending-loans'),api('/api/admin/pending-kyc'),api('/api/admin/pending-activations'),api('/api/settings/deposit')]);PENDING_WITHDRAWALS=w.items||[];PENDING_LOANS=l.items||[];PENDING_KYC=k.items||[];PENDING_ACTIVATIONS=a.items||[];if(s)DEPOSIT_SETTINGS=s;if(currentTab==='notifications'||currentTab==='settings'||currentTab==='chat'||currentTab==='register')return;const ae=document.activeElement;if(ae&&ae.matches&&ae.matches('input,textarea,select'))return;renderContent()}catch(e){toast('Failed to load: '+e.message,true);if(/token/i.test(e.message)){TOKEN='';localStorage.removeItem('admin_token');renderLogin('Session expired')}}}
function renderDashboard(){$('#app').innerHTML=`<div class="top-bar"><div><h1>Biashara Boost Admin</h1><div class="subtitle">Welcome, ${esc(ME?.name||'Administrator')}</div></div><button class="logout" onclick="logout()">Logout</button></div><div class="tabs">
<button class="tab" data-tab="withdrawals" onclick="switchTab('withdrawals')">💸 Withdrawals</button>
<button class="tab" data-tab="loans" onclick="switchTab('loans')">📝 Loans</button>
<button class="tab" data-tab="kyc" onclick="switchTab('kyc')">🆔 KYC / KRA</button>
<button class="tab" data-tab="activations" onclick="switchTab('activations')">⚡ Activations</button>
<button class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ Settings</button>
<button class="tab" data-tab="notifications" onclick="switchTab('notifications')">🔔 Notifications</button><button class="tab" data-tab="chat" onclick="switchTab('chat')">💬 Chat <span id="chatBadge"></span></button><button class="tab" data-tab="register" onclick="switchTab('register')">➕ Register</button>
</div><div id="content"></div>`;renderContent();loadData();clearInterval(refreshTimer);refreshTimer=setInterval(loadData,30000);initChat()}

let CHAT_SOCKET=null,CHAT_THREADS=[],CHAT_SEL=null,CHAT_MSGS=[],AC=null;
function chatUnlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(_){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,chatUnlock,{passive:true}));
function chatBeep(kind){try{if(!AC||AC.state!=='running')return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';if(kind==='send'){o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(920,t+.08)}else{o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1175,t+.13)}const d=kind==='send'?.14:.32;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(_){}}
function initChat(){if(CHAT_SOCKET||!window.io)return;CHAT_SOCKET=io(API_BASE||undefined,{auth:{token:TOKEN}});
CHAT_SOCKET.on('connect',chatLoadThreads);
CHAT_SOCKET.on('msg',m=>{if(CHAT_SEL===m.visitorId&&!CHAT_MSGS.find(x=>x._id===m._id)){CHAT_MSGS.push(m);chatDrawMsgs();if(m.from==='customer')CHAT_SOCKET.emit('history',{visitorId:m.visitorId},()=>{})}if(m.from==='customer')chatBeep('recv');chatLoadThreads()});
CHAT_SOCKET.on('msg:update',m=>{const i=CHAT_MSGS.findIndex(x=>x._id===m._id);if(i>-1){CHAT_MSGS[i]=m;chatDrawMsgs()}})}
function chatLoadThreads(){if(!CHAT_SOCKET)return;CHAT_SOCKET.emit('threads',null,l=>{CHAT_THREADS=l||[];const u=CHAT_THREADS.reduce((s,t)=>s+(t.visitorId===CHAT_SEL?0:t.unreadAdmin||0),0);const b=$('#chatBadge');if(b)b.textContent=u?'('+u+')':'';chatDrawThreads()})}
function chatDrawThreads(){const el=$('#chatThreads');if(!el)return;el.innerHTML=CHAT_THREADS.length?CHAT_THREADS.map(t=>`<div class="card" style="cursor:pointer;padding:10px;margin-bottom:8px;${t.visitorId===CHAT_SEL?'border-color:#238636':''}" onclick="chatOpen('${esc(t.visitorId)}')"><b>${esc(t.name||t.phone||'Visitor '+t.visitorId.slice(0,6))}</b>${t.unreadAdmin&&t.visitorId!==CHAT_SEL?` <span class="badge">${t.unreadAdmin} new</span>`:''}<div class="muted">${esc((t.lastMessage||'').slice(0,60))}</div></div>`).join(''):'<div class="empty">No chats yet</div>'}
function chatOpen(id){CHAT_SEL=id;CHAT_SOCKET.emit('history',{visitorId:id},l=>{CHAT_MSGS=l||[];$('#chatPane').style.display='block';const t=CHAT_THREADS.find(x=>x.visitorId===id);$('#chatWith').textContent=t?(t.name||t.phone||'Visitor')+(t.phone&&t.name?' · '+t.phone:''):'Visitor';chatDrawMsgs();const el=$('#chatMsgs');if(el)el.scrollTop=el.scrollHeight;chatLoadThreads()})}
function chatDrawMsgs(){const el=$('#chatMsgs');if(!el)return;const near=el.scrollHeight-el.scrollTop-el.clientHeight<150;
const bt='style="background:#30363d;color:#e6edf3;border:0;border-radius:12px;padding:3px 10px;font-size:11px;cursor:pointer"';
el.innerHTML=CHAT_MSGS.map(m=>{const mine=m.from==='admin',url=m.image?API_BASE+m.image:'',liked=m.liked&&(m.liked.customer||m.liked.admin);
const time=m.createdAt?new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const body=m.deleted?'<i style="opacity:.7">🚫 This message was deleted</i>':(m.image?`<img src="${esc(url)}" onclick="chatView('${esc(url)}')" style="display:block;width:220px;max-width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:4px;cursor:pointer;background:#0d1117">`:'')+esc(m.text);
const acts=m.deleted?'':`<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><button ${bt} onclick="chatLike('${esc(m._id)}')">${m.liked&&m.liked.admin?'💔 Unlike':'❤️ Like'}</button>${m.image?`<button ${bt} onclick="chatSave('${esc(url)}')">💾 Save photo</button>`:''}${mine?`<button ${bt} onclick="chatDel('${esc(m._id)}')">🗑 Delete</button>`:''}</div>`;
return `<div style="max-width:88%;margin:8px 0;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;${mine?'margin-left:auto;background:#1f6f2f;color:#fff':'background:#21262d'}">${body}${liked&&!m.deleted?' ❤️':''}${acts}<div style="font-size:10px;opacity:.65;margin-top:4px">${time}</div></div>`}).join('');
if(near)el.scrollTop=el.scrollHeight}
function chatLike(id){CHAT_SOCKET.emit('like',{id})}
function chatDel(id){if(!confirm('Delete this message for everyone?'))return;CHAT_SOCKET.emit('delete',{id},r=>{if(!r||!r.ok)toast('Could not delete',true)})}
function chatSave(url){fetch(url).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chat-photo-'+Date.now()+'.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Photo saved')}).catch(()=>{window.open(url,'_blank');toast('Opened photo — long-press to save')})}
function chatView(url){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000d;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px';d.innerHTML=`<img src="${esc(url)}" style="max-width:100%;max-height:78vh;border-radius:8px"><div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="vSave">💾 Save</button><button class="btn btn-secondary" id="vClose">Close</button></div>`;document.body.appendChild(d);d.querySelector('#vClose').onclick=()=>d.remove();d.querySelector('#vSave').onclick=()=>chatSave(url)}
function chatSend(){const i=$('#chatInput'),t=i.value.trim();if(!t||!CHAT_SEL)return;CHAT_SOCKET.emit('reply',{visitorId:CHAT_SEL,text:t},r=>{if(r&&r.ok)chatBeep('send');else toast((r&&r.error)||'Not sent',true)});i.value='';i.focus()}
function chatCompress(file,cb){const fr=new FileReader();fr.onerror=()=>cb(new Error('read'));fr.onload=()=>{const img=new Image();img.onerror=()=>cb(new Error('image'));img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>2.2e6&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}cb(null,d)};img.src=fr.result};fr.readAsDataURL(file)}
function chatAttach(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f||!CHAT_SEL)return;if(!/^image\//.test(f.type))return toast('Please choose a photo',true);if(f.size>20*1024*1024)return toast('Photo is too large',true);toast('Sending photo…');chatCompress(f,(err,data)=>{if(err)return toast('Could not read that photo',true);const i=$('#chatInput'),cap=i.value.trim();CHAT_SOCKET.emit('reply',{visitorId:CHAT_SEL,text:cap,image:data},r=>{if(r&&r.ok){chatBeep('send');i.value=''}else toast((r&&r.error)||'Photo not sent',true)})})}
function renderChat(el){if(!window.io)return el.innerHTML='<div class="empty">Chat library not loaded. Check the socket.io script tag.</div>';initChat();el.innerHTML=`<div class="card"><div class="card-name" style="margin-bottom:10px">💬 Live Chat</div><div id="chatThreads" style="max-height:220px;overflow:auto"></div></div><div class="card" id="chatPane" style="display:none"><div class="card-name" id="chatWith" style="margin-bottom:10px"></div><div id="chatMsgs" style="height:360px;overflow:auto;padding:6px;background:#0d1117;border-radius:8px"></div><div style="display:flex;gap:8px;margin-top:10px;align-items:center"><button class="btn btn-secondary" style="padding:10px 12px;font-size:16px" onclick="$('#chatFile').click()" aria-label="Send photo">📎</button><input type="file" id="chatFile" accept="image/*" hidden onchange="chatAttach(this)"><input id="chatInput" placeholder="Type a reply..." style="flex:1" onkeydown="if(event.key==='Enter')chatSend()"><button class="btn" onclick="chatSend()">Send</button></div></div>`;chatDrawThreads();chatDrawMsgs();if(CHAT_SEL){$('#chatPane').style.display='block'}}

/* ===== Customer registration (matches POST /api/register in server.js) ===== */
const REGISTER_ENDPOINT='/api/register';
const KE_COUNTIES=["Baringo", "Bomet", "Bungoma", "Busia", "Elgeyo-Marakwet", "Embu", "Garissa", "Homa Bay", "Isiolo", "Kajiado", "Kakamega", "Kericho", "Kiambu", "Kilifi", "Kirinyaga", "Kisii", "Kisumu", "Kitui", "Kwale", "Laikipia", "Lamu", "Machakos", "Makueni", "Mandera", "Marsabit", "Meru", "Migori", "Mombasa", "Murang'a", "Nairobi", "Nakuru", "Nandi", "Narok", "Nyamira", "Nyandarua", "Nyeri", "Samburu", "Siaya", "Taita-Taveta", "Tana River", "Tharaka-Nithi", "Trans Nzoia", "Turkana", "Uasin Gishu", "Vihiga", "Wajir", "West Pokot"];
function buildRegisterPayload(f){return{name:f.name,email:f.email,phone:f.phone,password:f.password,idNumber:f.idNumber||undefined,county:f.county,referral:f.referral||undefined}}
function renderRegister(el){el.innerHTML=`<div class="card"><div class="card-name" style="font-size:18px">➕ Register New Customer</div><div class="muted" style="margin:4px 0 16px">Create a customer account on their behalf. Fields marked * are required. The customer receives the standard welcome SMS and notification.</div>
<form id="regForm" novalidate autocomplete="off"><div class="reg-sec">Personal details</div><div class="grid2">
<div class="field"><label>Full name *</label><input id="rgName" placeholder="e.g. Jane Wanjiru" autocomplete="off"><div class="ferr" id="e-rgName"></div></div>
<div class="field"><label>Phone number *</label><input id="rgPhone" inputmode="tel" placeholder="07XXXXXXXX" autocomplete="off"><div class="ferr" id="e-rgPhone"></div></div>
<div class="field"><label>Email address *</label><input id="rgEmail" type="email" placeholder="name@example.com" autocomplete="off"><div class="ferr" id="e-rgEmail"></div></div>
<div class="field"><label>County *</label><select id="rgCounty"><option value="">Select county</option>${KE_COUNTIES.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="ferr" id="e-rgCounty"></div></div>
<div class="field"><label>National ID number</label><input id="rgId" inputmode="numeric" placeholder="e.g. 12345678" autocomplete="off"><div class="ferr" id="e-rgId"></div></div>
<div class="field"><label>Referral code</label><input id="rgRef" placeholder="Optional" autocomplete="off" style="text-transform:uppercase"><div class="ferr" id="e-rgRef"></div></div></div>
<div class="reg-sec">Account security</div><div class="grid2">
<div class="field"><label>Password *</label><div class="pw-wrap"><input id="rgPass" type="password" placeholder="At least 8 characters" autocomplete="new-password"><button type="button" onclick="regTogglePw()" aria-label="Show or hide password">👁</button></div><div class="ferr" id="e-rgPass"></div></div>
<div class="field"><label>Confirm password *</label><input id="rgPass2" type="password" placeholder="Repeat password" autocomplete="new-password"><div class="ferr" id="e-rgPass2"></div></div></div>
<div class="ferr" id="regFormErr" style="font-size:13px;margin-bottom:8px"></div>
<div class="actions"><button type="submit" class="btn" id="regBtn">Register customer</button><button type="button" class="btn btn-secondary" onclick="regReset()">Clear form</button></div></form>
<div id="regOk" style="display:none"></div></div>`;
$('#regForm').onsubmit=e=>{e.preventDefault();regSubmit()}}
function regTogglePw(){const a=$('#rgPass'),b=$('#rgPass2');const t=a.type==='password'?'text':'password';a.type=t;b.type=t}
function regReset(){const f=$('#regForm');if(f)f.reset();document.querySelectorAll('.ferr').forEach(x=>x.textContent='');document.querySelectorAll('#regForm input,#regForm select').forEach(x=>x.classList.remove('invalid'));const ok=$('#regOk');if(ok)ok.style.display='none';if(f)f.style.display='block'}
function regSubmit(){const v={name:$('#rgName').value.trim(),phone:$('#rgPhone').value.replace(/[\s-]/g,''),email:$('#rgEmail').value.trim(),county:$('#rgCounty').value,idNumber:$('#rgId').value.trim(),referral:$('#rgRef').value.trim().toUpperCase(),password:$('#rgPass').value,pass2:$('#rgPass2').value};
const errs={};
if(!/^\S+\s+\S+/.test(v.name))errs.rgName='Enter the full name (first and last name)';
if(!/^(?:\+?254|0)[17]\d{8}$/.test(v.phone))errs.rgPhone='Enter a valid Kenyan number, e.g. 0712345678';
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))errs.rgEmail='Enter a valid email address';
if(!v.county)errs.rgCounty='Select the customer’s county';
if(v.idNumber&&!/^\d{6,10}$/.test(v.idNumber))errs.rgId='ID number should be 6–10 digits';
if(v.referral&&!/^[A-Z0-9]{4,12}$/.test(v.referral))errs.rgRef='Referral code looks invalid';
if(v.password.length<8)errs.rgPass='Password must be at least 8 characters';
if(v.pass2!==v.password)errs.rgPass2='Passwords do not match';
['rgName','rgPhone','rgEmail','rgCounty','rgId','rgRef','rgPass','rgPass2'].forEach(k=>{$('#e-'+k).textContent=errs[k]||'';$('#'+k).classList.toggle('invalid',!!errs[k])});
$('#regFormErr').textContent='';
const first=Object.keys(errs)[0];if(first){$('#'+first).focus();return}
const b=$('#regBtn');b.disabled=true;b.textContent='Registering…';
api(REGISTER_ENDPOINT,{method:'POST',body:buildRegisterPayload(v)}).then(()=>{toast('Customer registered');const f=$('#regForm');f.style.display='none';const ok=$('#regOk');ok.style.display='block';ok.innerHTML=`<div style="text-align:center;padding:18px 6px"><div style="font-size:42px">✅</div><div class="card-name" style="margin:8px 0">Customer registered</div><div class="details" style="text-align:left"><div class="detail-row"><span>Name</span><span>${esc(v.name)}</span></div><div class="detail-row"><span>Phone</span><span>${esc(v.phone)}</span></div><div class="detail-row"><span>Email</span><span>${esc(v.email)}</span></div><div class="detail-row"><span>County</span><span>${esc(v.county)}</span></div></div><button class="btn btn-block" onclick="regReset()">Register another customer</button></div>`}).catch(e=>{$('#regFormErr').textContent=e.message||'Registration failed';toast('Registration failed: '+e.message,true)}).finally(()=>{b.disabled=false;b.textContent='Register customer'})}
function switchTab(t){currentTab=t;renderContent()}
function setActive(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}
function renderContent(){setActive();const el=$('#content');if(!el)return;
if(currentTab==='withdrawals'){if(!PENDING_WITHDRAWALS.length){el.innerHTML='<div class="empty">✅ No pending withdrawals</div>';return}const total=PENDING_WITHDRAWALS.reduce((s,x)=>s+Number(x.amount||0),0);el.innerHTML=`<div class="stats"><div class="stat"><div class="label">Pending withdrawals</div><div class="value yellow">${PENDING_WITHDRAWALS.length}</div></div><div class="stat"><div class="label">Total payout</div><div class="value green">KES ${total.toLocaleString()}</div></div></div>`+PENDING_WITHDRAWALS.map(tx=>`<div class="card"><div class="card-header"><div><div class="card-name">${esc(tx.user?.name)}</div><div class="card-sub">📱 ${esc(tx.user?.phone)}</div></div><div class="amount">-KES ${Number(tx.amount||0).toLocaleString()}</div></div><div class="details"><div class="detail-row"><span>Fee to collect</span><b>KES ${Number(tx.fee||0).toLocaleString()}</b></div><div class="detail-row"><span>Reference</span><span>${esc(tx.reference)}</span></div><div class="detail-row"><span>Created</span><span>${esc(tx.created_at)}</span></div></div><div class="actions"><button class="btn" onclick="openApproveWithdrawal('${esc(tx.id)}','${esc(tx.user?.name)}','${Number(tx.amount||0)}')">Approve</button><button class="btn btn-danger" onclick="rejectTx('${esc(tx.id)}')">Reject</button></div></div>`).join('')}
else if(currentTab==='loans'){if(!PENDING_LOANS.length){el.innerHTML='<div class="empty">✅ No pending loan applications</div>';return}el.innerHTML=PENDING_LOANS.map(l=>`<div class="card"><div class="card-header"><div><div class="card-name">${esc(l.full_name)}</div><div class="card-sub">📱 ${esc(l.phone)}</div></div><div class="amount">KES ${Number(l.amount||0).toLocaleString()}</div></div><div class="details">${[['Email',l.email],['ID Number',l.id_number],['Purpose',l.purpose],['Employment',l.employment],['Repayment',`${l.months||''} months × KES ${Number(l.monthly||0).toLocaleString()}`],['Total payable','KES '+Number(l.total||0).toLocaleString()],['Applied',l.created_at]].map(x=>`<div class="detail-row"><span>${x[0]}</span><span>${esc(x[1])}</span></div>`).join('')}</div><div class="actions"><button class="btn" onclick="openApproveLoan('${esc(l.id)}','${esc(l.full_name)}')">Approve Loan</button><button class="btn btn-danger" onclick="rejectLoan('${esc(l.id)}')">Reject</button></div></div>`).join('')}
else if(currentTab==='kyc'){if(!PENDING_KYC.length){el.innerHTML='<div class="empty">✅ No pending KYC submissions</div>';return}el.innerHTML=`<div class="stats"><div class="stat"><div class="label">Pending KYC</div><div class="value yellow">${PENDING_KYC.length}</div></div></div>`+PENDING_KYC.map(k=>{const kraPin=k.kra_pin||k.kraPin||k.kra?.pin||'';const kraStatus=k.kra_status||k.kraStatus||k.kra?.status||'';const kraDoc=k.kra_certificate_url||k.kraCertificateUrl||k.kra?.certificate_url||'';return `<div class="card"><div class="card-header"><div><div class="card-name">${esc(k.full_name)}</div><div class="card-sub">📱 ${esc(k.user?.phone)}</div></div><span class="badge">PENDING</span></div><div class="details">${[['ID Number',k.id_number],['Date of birth',k.dob||'N/A'],['Email',k.user?.email],['Submitted',k.submitted_at]].map(x=>`<div class="detail-row"><span>${x[0]}</span><span>${esc(x[1])}</span></div>`).join('')}</div><div class="kra-box"><b>🧾 KRA DETAILS</b><div class="detail-row"><span>KRA PIN</span><span>${esc(kraPin||'Not provided')}</span></div><div class="detail-row"><span>KRA status</span><span>${esc(kraStatus||'Not provided')}</span></div><div class="detail-row"><span>KRA certificate</span><span>${kraDoc?`<a style="color:#58a6ff" target="_blank" rel="noopener" href="${esc(kraDoc)}">View certificate</a>`:'Not uploaded'}</span></div><div class="muted">KRA information is displayed when supplied by your KYC API. No KRA verification is performed by this page.</div></div><div class="image-grid">${[['ID FRONT',k.id_front_url],['ID BACK',k.id_back_url],['SELFIE',k.selfie_photo_url]].map(x=>`<a target="_blank" rel="noopener" href="${esc(x[1]||'#')}">${x[0]}<img src="${esc(x[1]||'')}" alt="${x[0]}" onerror="this.style.display='none'"></a>`).join('')}</div><div class="actions"><button class="btn" onclick="approveKyc('${esc(k.id)}','${esc(k.full_name)}')">Approve</button><button class="btn btn-danger" onclick="rejectKyc('${esc(k.id)}','${esc(k.full_name)}')">Reject</button></div></div>`}).join('')}
else if(currentTab==='activations'){if(!PENDING_ACTIVATIONS.length){el.innerHTML='<div class="empty">✅ No pending wallet activations</div>';return}el.innerHTML=`<div class="stats"><div class="stat"><div class="label">Pending activations</div><div class="value yellow">${PENDING_ACTIVATIONS.length}</div></div></div>`+PENDING_ACTIVATIONS.map(a=>`<div class="card"><div class="card-header"><div><div class="card-name">${esc(a.name)}</div><div class="card-sub">📱 ${esc(a.phone)}</div></div><span class="badge">PENDING</span></div><div class="details"><div class="detail-row"><span>Email</span><span>${esc(a.email)}</span></div><div class="detail-row"><span>Requested</span><span>${esc(a.requested_at)}</span></div><div class="detail-row"><span>M-Pesa code</span><b>${esc(a.code)}</b></div></div><button class="btn btn-block" onclick="approveActivation('${esc(a.id)}','${esc(a.name)}')">Activate Wallet</button></div>`).join('')}
else if(currentTab==='settings')renderSettings(el);
else if(currentTab==='notifications')renderNotifications(el);else if(currentTab==='chat')renderChat(el);else if(currentTab==='register')renderRegister(el)}
function renderSettings(el){el.innerHTML=`<div class="card"><div class="card-name">💳 Deposit Settings</div><div class="field"><label>Payment method</label><select id="depMethod" onchange="toggleDepositFields()"><option value="paybill">M-Pesa Paybill</option><option value="till">M-Pesa Till</option><option value="sendmoney">Send Money</option></select></div><div id="fields-paybill"><div class="field"><label>Paybill number</label><input id="depPaybill"></div><div class="field"><label>Account number</label><input id="depPaybillAcc"></div></div><div id="fields-till" style="display:none"><div class="field"><label>Till number</label><input id="depTill"></div></div><div id="fields-sendmoney" style="display:none"><div class="field"><label>Phone number</label><input id="depSendPhone"></div><div class="field"><label>Registered name</label><input id="depSendName"></div></div><button class="btn btn-block" onclick="saveDepositSettings()">Save Deposit Settings</button></div>
<div class="card"><div class="card-name" style="margin-bottom:14px">🔓 Unlock Full Access Controls</div><div class="muted" style="margin-bottom:10px">Control whether customers see the KES 500 Unlock Full Access offer. This does not mark a wallet as paid or activated.</div><div class="toggle-row"><div><div class="toggle-label">Show offer to all customers</div><div class="toggle-desc">Global default; individual overrides take priority.</div></div><label class="switch"><input type="checkbox" id="globalUnlockOffer" onchange="saveGlobalUnlockOffer(this.checked)"><span class="slider"></span></label></div><div id="globalUnlockStatus" class="muted">Loading setting…</div></div><div class="card"><div class="card-name" style="margin-bottom:14px">⚙️ Customer Feature Controls</div><div class="field"><label>Search user by phone, email or ID</label><div style="display:flex;gap:8px"><input id="searchUserInput" placeholder="Customer details"><button class="btn" onclick="searchUser()">Search</button></div></div><div id="userProfile" style="display:none"><div class="details"><b id="uName"></b><div id="uPhone" class="muted"></div></div><div class="toggle-row"><div><div class="toggle-label">Unlock Full Access offer</div><div class="toggle-desc">Override the global setting for this customer.</div></div><select id="userUnlockOverride" onchange="saveUserUnlockOverride(this.value)"><option value="inherit">Follow global setting</option><option value="on">Force ON</option><option value="off">Force OFF</option></select></div>${[['wallet','Wallet activation','Unlock withdrawals and premium features'],['savings','Savings','Allow access to savings'],['insurance','Insurance','Allow access to insurance'],['bills','Bills','Allow bill payments'],['airtime','Airtime','Allow airtime purchases'],['scan','Scan to Pay','Allow QR scanning']].map(x=>`<div class="toggle-row"><div><div class="toggle-label">${x[1]}</div><div class="toggle-desc">${x[2]}</div></div><label class="switch"><input type="checkbox" id="t-${x[0]}" onchange="toggleFeature('${x[0]}',this.checked)"><span class="slider"></span></label></div>`).join('')}</div></div>`;$('#depMethod').value=DEPOSIT_SETTINGS.method||'paybill';$('#depPaybill').value=DEPOSIT_SETTINGS.paybillNumber||'';$('#depPaybillAcc').value=DEPOSIT_SETTINGS.paybillAccount||'';$('#depTill').value=DEPOSIT_SETTINGS.tillNumber||'';$('#depSendPhone').value=DEPOSIT_SETTINGS.sendMoneyNumber||'';$('#depSendName').value=DEPOSIT_SETTINGS.sendMoneyName||'';loadGlobalUnlockOffer()}
async function loadGlobalUnlockOffer(){try{const r=await api('/api/admin/settings/unlock-offer');$('#globalUnlockOffer').checked=r.enabled!==false;$('#globalUnlockStatus').textContent=$('#globalUnlockOffer').checked?'Offer is visible by default':'Offer is hidden by default'}catch(e){$('#globalUnlockStatus').textContent='Could not load global setting: '+e.message}}
async function saveGlobalUnlockOffer(enabled){try{await api('/api/admin/settings/unlock-offer',{method:'PUT',body:{enabled}});$('#globalUnlockStatus').textContent=enabled?'Offer is visible by default':'Offer is hidden by default';toast('Global Unlock Full Access offer '+(enabled?'enabled':'disabled'))}catch(e){$('#globalUnlockOffer').checked=!enabled;toast('Could not save setting: '+e.message,true)}}
async function saveUserUnlockOverride(value){if(!SEARCHED_USER)return;try{await api('/api/admin/users/'+encodeURIComponent(SEARCHED_USER.id)+'/unlock-offer',{method:'PUT',body:{override:value}});toast(value==='inherit'?'Customer now follows global setting':'Unlock offer '+(value==='on'?'enabled':'disabled')+' for customer')}catch(e){toast('Could not update customer offer: '+e.message,true)}}
function toggleDepositFields(){const m=$('#depMethod').value;['paybill','till','sendmoney'].forEach(x=>$('#fields-'+x).style.display=x===m?'block':'none')}
async function saveDepositSettings(){const payload={method:$('#depMethod').value,paybillNumber:$('#depPaybill').value.trim(),paybillAccount:$('#depPaybillAcc').value.trim(),tillNumber:$('#depTill').value.trim(),sendMoneyNumber:$('#depSendPhone').value.trim(),sendMoneyName:$('#depSendName').value.trim()};try{await api('/api/admin/settings/deposit',{method:'PUT',body:payload});toast('Deposit settings saved')}catch(e){toast('Failed: '+e.message,true)}}
async function searchUser(){const q=$('#searchUserInput').value.trim();if(!q)return toast('Enter customer details',true);try{const r=await api('/api/admin/lookup?q='+encodeURIComponent(q));SEARCHED_USER=r.user;$('#userProfile').style.display='block';$('#uName').textContent=SEARCHED_USER.name||'';$('#uPhone').textContent=SEARCHED_USER.phone||'';const f=SEARCHED_USER.features||{};$('#t-wallet').checked=!!SEARCHED_USER.wallet_activated;$('#userUnlockOverride').value=SEARCHED_USER.unlock_offer_override===true?'on':(SEARCHED_USER.unlock_offer_override===false?'off':'inherit');['savings','insurance','bills','airtime','scan'].forEach(x=>$('#t-'+x).checked=!!f[x])}catch(e){SEARCHED_USER=null;$('#userProfile').style.display='none';toast('User not found: '+e.message,true)}}
async function toggleFeature(key,on){if(!SEARCHED_USER)return;try{if(key==='wallet')await api('/api/admin/users/'+encodeURIComponent(SEARCHED_USER.id)+'/activate-wallet',{method:'PUT',body:{status:on}});else await api('/api/admin/users/'+encodeURIComponent(SEARCHED_USER.id)+'/feature',{method:'PUT',body:{feature:key,status:on}});toast(key+' '+(on?'enabled':'disabled'))}catch(e){$('#t-'+key).checked=!on;toast('Update failed: '+e.message,true)}}
function renderNotifications(el){el.innerHTML=`<div class="card"><div class="card-name" style="margin-bottom:5px">🔔 Customer Notifications & Announcements</div><div class="muted" style="margin-bottom:15px">Send a private message to one customer or an announcement to all customers.</div><div class="field"><label>Recipient</label><select id="noticeTarget" onchange="noticeTargetChanged()"><option value="all">All customers</option><option value="individual">Individual customer</option></select></div><div class="field" id="noticeCustomerField" style="display:none"><label>Customer phone, email or ID</label><input id="noticeCustomer" placeholder="Enter customer details"></div><div class="field"><label>Category</label><select id="noticeType"><option value="announcement">Website announcement</option><option value="offer">Offer / promotion</option><option value="account_issue">Account issue</option><option value="verification">KYC / verification issue</option><option value="wallet">Wallet update</option><option value="general">General update</option></select></div><div class="field"><label>Title</label><input id="noticeTitle" maxlength="100" placeholder="Notification title"></div><div class="field"><label>Message</label><textarea id="noticeMessage" rows="5" maxlength="1500" placeholder="Write your message..."></textarea></div><div class="field"><label>Optional expiry date</label><input id="noticeExpiry" type="date"></div><button class="btn btn-block" id="sendNoticeBtn" onclick="sendAdminNotice()">📨 Send Notification</button><p class="muted" style="margin-top:10px;color:#d29922">Messages are delivered to the selected customer or all customer accounts. Individual messages accept phone, email or customer ID.</p></div><div class="card"><div class="card-name" style="margin-bottom:12px">📬 Sent Notification History</div><button class="btn btn-secondary" onclick="loadNoticeHistory()">Refresh history</button><div id="noticeHistory" class="muted" style="margin-top:12px">Press refresh to load history.</div></div>`}
function noticeTargetChanged(){$('#noticeCustomerField').style.display=$('#noticeTarget').value==='individual'?'block':'none'}
async function sendAdminNotice(){const target=$('#noticeTarget').value,title=$('#noticeTitle').value.trim(),message=$('#noticeMessage').value.trim(),customer=$('#noticeCustomer')?.value.trim()||'';if(!title||!message)return toast('Enter a title and message',true);if(target==='individual'&&!customer)return toast('Enter the customer details',true);const b=$('#sendNoticeBtn');b.disabled=true;b.textContent='Sending...';try{const result=await api('/api/admin/notifications',{method:'POST',body:{target,customer,type:$('#noticeType').value,title,message,expiresAt:$('#noticeExpiry').value||null}});toast('Notification sent to '+(result.sent||0)+' customer(s)');$('#noticeTitle').value='';$('#noticeMessage').value='';loadNoticeHistory()}catch(e){toast('Not sent: '+e.message,true)}finally{b.disabled=false;b.textContent='📨 Send Notification'}}
async function loadNoticeHistory(){const box=$('#noticeHistory');if(!box)return;box.textContent='Loading...';try{const r=await api('/api/admin/notifications');const items=r.items||r.notifications||[];if(!items.length){box.textContent='No notification records returned by server.';return}box.innerHTML=items.map(n=>`<div style="padding:12px 0;border-bottom:1px solid #30363d"><b>${esc(n.title)}</b><div style="margin:5px 0">${esc(n.message)}</div><div class="muted">${esc(n.target==='all_customers'?'All customers':n.target||'Individual customer')} · ${Number(n.recipients||1)} recipient(s) · ${esc(n.created_at||n.createdAt||'')}</div></div>`).join('')}catch(e){box.textContent='History unavailable: '+e.message}}
function openApproveWithdrawal(id,name,amount){currentTxId=id;currentLoanId=null;$('#modalTitle').textContent='Approve withdrawal — '+name;$('#modalDesc').textContent='Confirm payout of KES '+Number(amount).toLocaleString()+'. Enter the M-Pesa receipt code.';$('#modalField').style.display='block';$('#mpesaReceipt').value='';$('#modalBg').classList.add('on')}
function openApproveLoan(id,name){currentLoanId=id;currentTxId=null;$('#modalTitle').textContent='Approve loan — '+name;$('#modalDesc').textContent='This will mark the loan as active and notify the customer.';$('#modalField').style.display='none';$('#modalBg').classList.add('on')}
function closeModal(){$('#modalBg').classList.remove('on');currentTxId=null;currentLoanId=null}
async function confirmApprove(){try{if(currentTxId){const receipt=$('#mpesaReceipt').value.trim();if(!receipt)return toast('Enter M-Pesa receipt code',true);await api('/api/admin/approve-withdrawal',{method:'POST',body:{txId:currentTxId,mpesaReceipt:receipt}});toast('Withdrawal approved')}else if(currentLoanId){await api('/api/admin/approve-loan',{method:'POST',body:{loanId:currentLoanId}});toast('Loan approved')}closeModal();loadData()}catch(e){toast('Approval failed: '+e.message,true)}}
async function approveKyc(id,name){if(!confirm('Approve KYC for '+name+'?'))return;try{await api('/api/admin/approve-kyc',{method:'POST',body:{kycId:id,action:'approve'}});toast('KYC approved');loadData()}catch(e){toast('KYC approval failed: '+e.message,true)}}
async function rejectKyc(id,name){const reason=prompt('Reason for rejecting KYC for '+name+':','Documents not clear');if(reason===null)return;try{await api('/api/admin/approve-kyc',{method:'POST',body:{kycId:id,action:'reject',reason:reason||'Documents not clear'}});toast('KYC rejected');loadData()}catch(e){toast('KYC rejection failed: '+e.message,true)}}
async function approveActivation(id,name){if(!confirm('Have you verified the KES 500 payment for '+name+'?'))return;try{await api('/api/admin/users/'+encodeURIComponent(id)+'/activate-wallet',{method:'PUT',body:{status:true}});toast('Wallet activated');loadData()}catch(e){toast('Activation failed: '+e.message,true)}}
async function rejectTx(id){const reason=prompt('Reason for rejecting this withdrawal:','Unable to verify withdrawal request');if(reason===null)return;try{await api('/api/admin/reject-withdrawal',{method:'POST',body:{txId:id,reason}});toast('Withdrawal rejected and funds returned to customer wallet');loadData()}catch(e){toast('Rejection failed: '+e.message,true)}}
async function rejectLoan(id){const reason=prompt('Reason for rejecting this loan:','Application did not meet lending criteria');if(reason===null)return;try{await api('/api/admin/reject-loan',{method:'POST',body:{loanId:id,reason}});toast('Loan application rejected');loadData()}catch(e){toast('Rejection failed: '+e.message,true)}}
function logout(){TOKEN='';localStorage.removeItem('admin_token');clearInterval(refreshTimer);renderLogin()}
(async function init(){if(!TOKEN)return renderLogin();try{const r=await api('/api/me');if(!r.user||r.user.role!=='admin'){TOKEN='';localStorage.removeItem('admin_token');return renderLogin('Not an admin account')}ME=r.user;renderDashboard()}catch(e){TOKEN='';localStorage.removeItem('admin_token');renderLogin('Please sign in again')}})();
</script>
</body>
